# Конфигурация наблюдателя за howborisusesclaudecode.com
#
# Здесь нет ни одного секрета. Всё чувствительное — только через переменные
# окружения (см. watcher/config.py, класс Secrets).
#
# Правило: если параметр меняет ПОВЕДЕНИЕ (порог, лимит, тон, модель) — он
# живёт здесь. Если он меняет АЛГОРИТМ — он живёт в коде. Это то самое
# требование «тон, формат и объём разбора меняются без правки остального кода».

[source]
url = "https://howborisusesclaudecode.com/"
timeout_seconds = 30
# Три попытки внутри одного прогона. Сайт может моргнуть — это не повод
# будить алерт, для этого есть счётчик подряд идущих неудачных прогонов.
retries = 3
retry_backoff_seconds = 5
# Представляемся честно. Анонимный скрапер с дефолтным UA — плохая манера
# и первый кандидат на бан.
user_agent = "hbucc-watcher/1.0 (personal change monitor; contact: eleru340@gmail.com)"

[detect]
# Порог difflib.SequenceMatcher.ratio() для решения «правка» vs
# «удаление + добавление». 0.55 — стартовое значение, откалиброванное
# синтетикой через tools/replay.py. Перепроверять на первых реальных событиях.
match_threshold = 0.55

# Порог значимости правки: похожесть, выше которой правка считается мелкой —
# пишется в журнал, но модель не будят и сообщение не уходит. Исправленная
# опечатка иначе стоит те же $0.08–0.27 и то же место в Telegram, что и
# переписанный заново совет.
#
# Это ПЕРВОЕ из двух условий мелочи; второе — «замена ровно одного слова, и
# слово состоит из букв» — живёт в коде (detect.is_single_word_replacement),
# потому что оно не настраивается. Замер по всем 127 советам показал, почему
# одного порога мало: вставка слова даёт ratio от 0.989, и вставленное «not»
# прошло бы молча на 126 советах из 127. Токен с цифрой, флагом, путём или
# парой «ключ=значение» словом не считается: `allow=true,mode=safe` ->
# `allow=false,mode=unsafe` формально одна замена, а по сути две правки.
#
# Мера здесь та же, что у match_threshold, поэтому порог зависит от длины
# совета: одно слово из 119 (медиана сайта) даёт 0.992, из 43 (самый короткий)
# — 0.977. 0.99 откалиброван по всем 127 советам, `tools/replay.py --minor`:
# опечатка проходит молча в 70 советах из 127, всё остальное доходит до
# разбора. Осознанный остаток: замена слова на противоположное по смыслу от
# опечатки мерой текста не отличается. Поэтому пропущенное остаётся в
# state/delivered.json и видно в git diff.
# Выключить: поставить 1.01, тогда мелочью не будет считаться ничего.
minor_edit_ratio = 0.99

# --- инварианты: любой сработавший = ALERT, состояние не двигаем ---
# Меньше этого числа частей — парсер сломался, а не сайт похудел.
# Значение подтягивается из снапшота (known_parts), здесь — абсолютный пол
# для самого первого запуска.
min_parts_absolute = 5
# Падение общего объёма текста больше чем на столько процентов — заглушка,
# капча или обрезанный ответ.
max_text_shrink_pct = 40
# Если за один прогон «изменилось» больше этой доли блоков — это перевёрстка,
# а не сто правок. Самый важный инвариант: без него сломанный парсер
# превращается в сорок разборов подряд.
max_changed_blocks_pct = 60
# Тело меньше этого — точно не наш документ.
min_body_bytes = 50000

# Больше этого числа разборов за прогон не отправляем. Остальные приедут
# следующим прогоном: снапшот не двигается, пока не доставлено всё.
max_events_per_run = 8

[reports]
# Страницы разборов. Полный разбор — 5–7 тысяч символов, и в мессенджере
# он читается плохо, а через неделю не находится вовсе. Поэтому разбор
# живёт страницей, а в Telegram уходит карточка со ссылкой.
#
# Выключатель здесь не для красоты: публикация ходит в чужой репозиторий
# по отдельному токену, и когда он не заведён или отозван, система обязана
# продолжать работать по-старому, а не молчать.
enabled = true
# Репозиторий отчётов. Публичный и отдельный: разборы читаются по ссылке
# из Telegram, а сам наблюдатель приватный.
repo = "RiobVO/hbucc-reports"
# Куда GitHub Pages отдаёт эти страницы.
base_url = "https://riobvo.github.io/hbucc-reports"

[model]
name = "gpt-5.6-terra"
# Вход у нас маленький (фрагмент + контекст), выход — связный русский текст
# с проверкой по первоисточникам. high оправдан.
effort = "high"
max_tokens = 16000

# Раз в сколько часов проверять, что ключ жив и квота не кончилась.
# Прогон без изменений на сайте до модели не доходит и пингует сторожа как
# чистый — без этой пробы кончившаяся квота обнаружилась бы только на первом
# настоящем событии, то есть ровно тогда, когда разбор нужен. Сутки, а не
# каждый прогон: состояние аккаунта меняется раз в месяцы, а лишний запрос
# каждые шесть часов — это счёт и трафик на пустом месте.
probe_interval_hours = 24

# Ставки провайдера — для строки «сколько стоил разбор» на странице.
# Здесь, а не в коде: их меняет провайдер без нашего участия, и зашитое
# число тихо врало бы на каждой странице.
# Сверено с официальным прайсом 31 июля 2026. Раньше здесь стояло
# 2.50/15.00 — на четверть выше настоящего, и каждая опубликованная
# страница врала в строке «стоил разбор».
price_input_per_mtok = 2.00
price_output_per_mtok = 12.00
# Веб-поиск: $10 за 1000 вызовов.
price_per_search = 0.01

# --- веб-поиск (server-side, только он) ---
# Нужен для слоя 3: найти страницу официальной документации, адрес которой
# заранее неизвестен. Потолка на ЧИСЛО вызовов у этого инструмента нет —
# в отличие от прежнего провайдера. Поиск стоит $10 за 1000 обращений,
# поэтому фактическое число поисков логируется на каждом разборе: без
# потолка единственный способ заметить разгон — смотреть на него.
# low | medium | high — сколько контекста отдавать под результаты поиска.
web_search_context_size = "medium"

# --- загрузка первоисточников (наш код, watcher/original.py) ---
# Слой 1 «что сказал автор оригинала» собирается до вызова модели: код сам
# открывает пост и берёт из него og:description. Так белый список применяет
# наш код, покрытый тестами, а не обещание провайдера в документации.
# Шесть загрузок хватает на совет с первоисточником плюс несколько ссылок.
max_source_fetches = 6
# Твит укладывается в 280 символов; 1200 берём с запасом на длинные посты
# и на описания страниц документации.
max_source_chars = 1200
# Потолок на тело чужой страницы, в байтах. Ограничение выше режет ТЕКСТ,
# то есть промт; этот режет трафик и память. Без него многогигабайтный или
# бесконечный ответ с разрешённого домена клал бы раннер раньше, чем дело
# дошло бы до обрезки.
max_source_bytes = 2000000

# Белый список доменов для верификации. Модель ходит по ссылкам, которые
# написал КТО-ТО ДРУГОЙ на недоверенной странице — это единственная защита.
# Ссылка вне списка НЕ открывается, но попадает в разбор как факт
# («ведёт на такой-то домен, не открывал») — иначе whitelist превращает
# неизвестную ссылку в невидимую.
allowed_domains = [
    "x.com",
    "docs.claude.com",
    "code.claude.com",
    "claude.com",
    "support.claude.com",
]

[telegram]
# Лимит Telegram — 4096. 3900 оставляет запас на служебный префикс «[2/3]».
chunk_chars = 3900
# HTML, а не MarkdownV2: экранировать надо три символа (& < >) вместо
# четырнадцати. Меньше поводов сломать сообщение на чужом тексте.
parse_mode = "HTML"

[alerts]
# Сколько прогонов подряд должно упасть, прежде чем шуметь.
# 3 прогона × 6 часов = ~18 часов молчания источника.
source_failures_before_alert = 3
model_failures_before_alert = 3

[state]
# Сколько записей храним — отдельно доставленных и отдельно закрытых молча
# (правки ниже порога значимости). Считаются они по отдельности, иначе поток
# опечаток вытеснил бы из журнала id доставленного события, а это единственная
# защита от повторной отправки. Значит потолок журнала — вдвое больше этого
# числа. ~50 событий в год.
ledger_keep = 500
# Коммит heartbeat не чаще раза в этот интервал — иначе история репозитория
# превратится в 120 коммитов «touch» в месяц. Но и не реже: 60 дней без
# активности = GitHub отключает scheduled workflow.
heartbeat_commit_interval_hours = 20
